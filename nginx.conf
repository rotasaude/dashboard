# apps/dashboard/nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Módulo 11 (ADR 0023): o formulário de unidade consulta o CEP direto do
  # navegador em https://viacep.com.br. Se um dia houver Content-Security-Policy
  # aqui, o connect-src precisa liberar esse host, senão a consulta cai sempre
  # em "não foi possível consultar o CEP".

  # Assets com hash no nome podem ser cacheados para sempre; o index.html não,
  # senão um deploy novo continua servindo o bundle velho.
  location /dashboard/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /dashboard/index.html {
    add_header Cache-Control "no-cache";
  }

  # Rota de SPA: qualquer caminho sob /dashboard/ cai no index.
  location /dashboard/ {
    try_files $uri $uri/ /dashboard/index.html;
  }

  location = /up {
    access_log off;
    return 200 "ok";
  }

  # Fallthrough explícito: qualquer coisa fora de /dashboard/ e /up (inclusive
  # /) 404, nunca a página padrão do nginx.
  location / {
    return 404;
  }
}
